project:
  type: book
  output-dir: docs

book:
  title: DataTrail Portfolio Course
  favicon: img/CITS+logo+png.ico
  bread-crumbs: false

  page-navigation: true
  search: true
  repo-url: https://github.com/alexandragrayson/course-page/edit/main/_quarto.yml
