  google-analytics: "G-XXXXXXXXXX"
  
  chapters:
    - index.qmd
    - intro.qmd
    - part: "2 Getting Started with Accounts and Repositories"
      chapters:
        - _3a-prerequisites.qmd
        - _3b-bio-and-headshot.qmd
        - _3c-github.qmd
        - _3d-cv.qmd
        - _3e-linkedin.qmd
        - _3f-kaggle.qmd
    - _4-home-page.qmd
    - _5-links.qmd
    - _6-news.qmd
    - _7-projects.qmd
    - part: "7 Blog Assignments"
      chapters:
        - _8a-whyblog.qmd
        - _8b-blogassignments.qmd
    - _10-further-customizing.qmd
